<script>
  // 외부 스크립트 단계의 오류도 빈 화면으로 숨지 않도록 최소 진단기를 둡니다.
  (function(){
    function showBootError(message){
      window.setTimeout(function(){
        var main = document.getElementById('main');
        if(!main || main.childElementCount) return;
        main.innerHTML = '<section class="panel render-error"><p class="eyebrow">SCREEN ERROR</p><h2>화면을 표시하지 못했습니다.</h2><p class="sub">오류 정보를 확인해 수정 중입니다.</p><code class="render-error-code"></code></section>';
        var code = main.querySelector('.render-error-code'); if(code) code.textContent = message || '알 수 없는 오류';
      }, 0);
    }
    window.addEventListener('error', function(event){ showBootError(event.message || '스크립트 실행 오류'); });
    window.addEventListener('unhandledrejection', function(event){ showBootError(event.reason && event.reason.message ? event.reason.message : String(event.reason || '처리되지 않은 오류')); });
  })();
</script>
</head>
<body>
<div class="app">

  <header class="topbar">
    <h1>사내 일정 관리</h1>
    <nav id="primaryNav" class="primary-nav" aria-label="주요 메뉴"></nav>
    <div class="spacer"></div>
    <span class="status" id="appStatus" aria-live="polite">준비 중…</span>
    <div id="accountActions"></div>
  </header>

  <main id="main"></main>

</div>

<button id="themeToggleBtn" class="theme-toggle" aria-label="다크 라이트 테마 토글 스위치">🌙</button>

<script>
  (function(){
    const btn = document.getElementById('themeToggleBtn');
    const saved = localStorage.getItem('scheduleBoardTheme');
    if(saved === 'light'){
      document.body.classList.add('light-theme');
      btn.textContent = '☀️';
    }
    btn.onclick = function(){
      document.body.classList.toggle('light-theme');
      const isLight = document.body.classList.contains('light-theme');
      localStorage.setItem('scheduleBoardTheme', isLight ? 'light' : 'dark');
      btn.textContent = isLight ? '☀️' : '🌙';
    };
  })();
</script>
