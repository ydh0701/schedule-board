<button id="themeToggleBtn" class="theme-toggle" aria-label="다크 라이트 테마 토글 스위치">🌙</button>

<script>
  (function(){
    const btn = document.getElementById('themeToggleBtn');
    const saved = localStorage.getItem('scheduleBoardTheme');
    if(saved === 'light'){
      document.body.classList.add('light-theme');
      btn.textContent = '☀️';
    }
    btn.onclick = function(){
      document.body.classList.toggle('light-theme');
      const isLight = document.body.classList.contains('light-theme');
      localStorage.setItem('scheduleBoardTheme', isLight ? 'light' : 'dark');
      btn.textContent = isLight ? '☀️' : '🌙';
    };
  })();
</script>
