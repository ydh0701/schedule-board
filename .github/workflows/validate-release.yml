name: 배포 파일 검사

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          npm ci
          node scripts/verify_release.js
          node scripts/verify_rules_contract.js
      - run: npx firebase-tools emulators:exec --only firestore --project fmv-schedule-rules-test "npm run test:rules"

